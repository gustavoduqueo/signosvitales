name = "medic-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Sites allowed to call MEDIC from a browser (http://localhost is always allowed for development)
ALLOWED_ORIGINS = "https://gustavoduqueo.github.io"
# Optional: force a specific Groq model (otherwise llama-3.3-70b-versatile, then llama-3.1-8b-instant)
# GROQ_MODEL = "llama-3.3-70b-versatile"

# The Groq API key is a secret, set it with:  npx wrangler secret put GROQ_API_KEY
